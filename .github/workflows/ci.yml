name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-slim

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Security Audit (Production only)
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if output=$(npm audit --omit=dev --audit-level=high --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000 --fetch-timeout=120000 2>&1); then
            printf '%s\n' "$output"
            exit 0
          else
            status=$?
          fi
          printf '%s\n' "$output"

          case "$output" in
            *"audit endpoint returned an error"*|*"audit network timeout"*|*"ECONNRESET"*|*"ETIMEDOUT"*|*"EAI_AGAIN"*|*"ENETUNREACH"*|*"ENOTFOUND"*)
              ;;
            *)
              exit "$status"
              ;;
          esac

          if [ "$attempt" -lt 3 ]; then
            sleep "$((attempt * 10))"
          fi
        done
        exit "$status"

    - name: Run lint
      run: npm run lint

    - name: Run license check
      run: npm run license:check

    - name: Run build
      run: npm run build

    - name: Run tests
      run: npm run test

    - name: Run E2E tests
      run: npm run test:e2e
